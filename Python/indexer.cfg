# indexer.cfg
# Configuration for the unified index builder (build_indexes.py).
# Shared by build_indexes.py via cfg_loader.py.
# Lines beginning with # are comments. Inline # comments are supported on pattern lines.


[paths]
# root_directory: CHANGE THIS FIRST on a new install — it is the one value here that
# is machine-specific. The value below is the author's own corpus root, kept as a
# working example rather than a placeholder.
#
# Only host runs read it. Anything started by docker-compose sets the CORPUS_ROOT
# environment variable instead, which takes precedence over this line (see
# build_indexes.py -> resolve_paths). So a wrong value here fails quietly: the
# container keeps working while refresh_indexes.bat walks the wrong tree.
root_directory = D:\claude\filesystem\

# index_directory: where all derived index artifacts are written.
# This now controls all three outputs together:
#   - directory_index.md
#   - directory_index_with_files.md
#   - search_index.db  (the MCP servers' DB_PATH must match)
# Absolute path:       D:\claude\filesystem\index
# Root-relative path:  /index/  (resolves to root_directory\index\)
# Blank:               defaults to root_directory
index_directory = /index/


[directory_index]
# Controls which directories appear in directory_index.md and directory_index_with_files.md.
# mode = blacklist  ->  all directories included except those listed below
# mode = whitelist  ->  only directories listed below are included
mode = blacklist

# Pattern syntax:
#   dirname/      exclude this directory and all contents (won't appear in any output)
#   dirname/*.*   directory appears in the tree but its files are not listed or indexed
#                 (use this when you need to navigate TO a directory but don't care what's inside)

.git/
.obsidian/
.vscode/
.github/
__pycache__/
node_modules/
Trash/*.*
Other_References/First_Contact_Series/*.*
.claude/
# An imported game-system rulebook: several hundred source pages that nobody navigates by name,
# kept visible as a directory but not listed file by file. Unlike [search_index] below, patterns
# in this section match a path relative to the root, so this names the source directory itself.
Game_Systems/EclipsePhase/source/*.*

# Raw transcript captures (capture_transcript.py). The directory stays visible so the archive
# is discoverable, but its files are neither listed nor indexed: each is ~1MB of JSONL holding
# the same prose as the cleaned transcript beside it. Indexing them would double every
# transcript hit and let a raw dump outrank the readable file it was derived from.
World_Building/raw_transcript_archive/*.*

[search_index]
# Directories excluded from search_index.db, in addition to directory_index exclusions.
# These directories still appear in the directory tree; their files are just not indexed.
# Always blacklist — search exclusions are additive on top of directory_index exclusions.

Python/
Perchance_prompts/
Sheet_Import/
Miscelanious_rpg_material/

# Private game-system modules nested under Game_Systems/, kept out of corpus search until they
# are indexed on purpose. An imported rulebook is hundreds of pages whose vocabulary overlaps
# setting lore (bodies, egos, stress), so letting it in by default mixes system rules into lore
# results. Patterns here match a single directory NAME at any depth, not a path, which is why
# this names the module directory rather than Game_Systems/<module>/source/.
EclipsePhase/


[file_types]
# Controls which file extensions are eligible for search indexing.
# mode = whitelist  ->  only listed extensions are indexed
# mode = blacklist  ->  all extensions indexed except those listed
mode = whitelist

*.md
*.txt
*.svg
*.jpg


[embedding]
# batch_size: how many documents are handed to a single ONNX inference call
# while building the vector index (the semantic/hybrid search lane). fastembed's
# own default is 256 — fine on a desktop, but it means the whole batch's tensors
# are sized and allocated at once, which can exceed available RAM on a
# constrained host. Concretely: building this index under Termux's proot-distro
# on a phone (sharing the device's RAM with the rest of Android) got the build
# process OOM-killed at the default, and once the whole Termux app besides, on
# a 613-file / 539-indexed corpus. Dropping this to 8 fixed it completely — same
# corpus, same phone, only this number changed.
#
# There's no quality or completeness cost to a smaller batch: it just means more,
# smaller embedding calls to cover the same corpus, so a slower but non-fatal
# build. Leave commented out (or omit the section) to fall back to the
# CORPUS_EMBED_BATCH_SIZE env var, or fastembed's built-in 256 if that's unset
# too — see embedding.py.
#
# Only build_indexes.py ever reads this. search_mcp_server.py never batches —
# it embeds one query string at a time — so this setting has no effect there.
batch_size = 256

[context_limits]
# How many lines of each file the search indexer reads for content.
#  -1      entire file (default)
#   0      filename and path only, no content stored
#           use for binary or image types where content is not meaningful
#   N      first N lines only
#  line_N  read line N of the file, extract the first integer found there,
#           use that integer as the line limit for this file.
#           useful for files that declare their own indexable depth in a header.

default = -1
*.jpg = 0
*.svg = 4
*.aimap.svg = line_8
*.db = 0